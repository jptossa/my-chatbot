<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviewer login</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="login card">
    <h2>Reviewer login</h2>
    <form id="form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p id="message" class="error small"></p>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script>
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("message");
      message.textContent = "";
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (response.ok) location.reload(); // the server now decides: dashboard or no access
      else message.textContent = (await response.json().catch(() => ({}))).error || "Login failed.";
    });
  </script>
</body>
</html>
